<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Flashcards</title>
    <link rel="stylesheet" href="style.css">
    <!-- highlight.js stylesheet -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
</head>

<body>
    <div class="container">
        <!-- Mobile Navigation Buttons -->
        <div class="mobile-nav" id="mobile-prev-button">◀</div>
        <div class="mobile-nav" id="mobile-next-button">▶</div>

        <div id="progress-text">Card 0 of 0</div>
        <div class="flashcard" id="flashcard">
            <div class="card-face card-front" id="card-question">
                <!-- Question will be loaded here -->
            </div>
            <div class="card-face card-back" id="card-answer">
                <!-- Answer will be loaded here -->
            </div>
        </div>
        <div class="navigation">
            <button id="prev-button">◀ Previous (Left Arrow)</button>
            <button id="flip-button">Flip Card (Spacebar)</button>
            <button id="next-button">Next (Right Arrow) ▶</button>
        </div>
        <div class="instructions">
            Use arrow keys for navigation and spacebar to flip.
        </div>
    </div>
    <!-- highlight.js script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
